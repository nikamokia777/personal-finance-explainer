name: CI Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pytest -v

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r frontend/requirements.txt
      - run: python -m compileall -q frontend

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-checks
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs:
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: deploy
    env:
      DROPLET_IP: ${{ secrets.DROPLET_IP }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DROPLET_IP" >> ~/.ssh/known_hosts
      - name: Pull new code and restart containers
        run: |
          ssh -i ~/.ssh/deploy_key deploy@"$DROPLET_IP" "
            cd finance-explainer &&
            git fetch origin main &&
            git reset --hard origin/main &&
            docker compose up -d --build &&
            docker image prune -f
          "
      - name: Check the site is up
        run: |
          for i in $(seq 1 30); do
            curl -fs "http://$DROPLET_IP/_stcore/health" && exit 0
            sleep 5
          done
          exit 1
